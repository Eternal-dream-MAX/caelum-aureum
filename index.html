<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CAELUM AUREUM · 金色天城</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#070a10;
    font-family:"Optima","Palatino Linotype","Georgia","Songti SC","SimSun",serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none;filter:saturate(1.16) contrast(1.08) brightness(1.02)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse 78% 66% at 50% 44%,rgba(0,0,0,0) 40%,rgba(12,16,26,.20) 76%,rgba(6,9,16,.52) 100%)}

  /* ── 主 UI ───────────────────────────── */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #ui .panel{pointer-events:auto}

  .brand{position:absolute;left:34px;top:26px;opacity:0;animation:fadeUp 1.6s .5s forwards}
  .brand h1{
    font-size:26px;font-weight:400;letter-spacing:.42em;
    background:linear-gradient(178deg,#fbf1d6 0%,#e8c982 38%,#b8873a 72%,#f6e2ae 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));line-height:1.1}
  .brand .sub{margin-top:9px;font-size:10.5px;letter-spacing:.34em}
  .brand .sub{color:rgba(206,186,150,.72)}
  .brand .rule{margin-top:11px;width:112px;height:1px;
    background:linear-gradient(90deg,rgba(216,169,78,.85),rgba(216,169,78,0))}
  .brand .cn{margin-top:8px;font-size:12px;letter-spacing:.52em;color:rgba(232,216,186,.55)}

  .hint{position:absolute;left:34px;bottom:26px;font-size:11px;line-height:2.05;
    letter-spacing:.13em;color:rgba(226,212,184,.5)}
  .hint b{color:rgba(240,207,120,.9);font-weight:400}
  .hint .k{display:inline-block;min-width:64px;color:rgba(240,207,120,.82)}

  #dock{position:absolute;right:26px;bottom:26px;display:flex;gap:9px;flex-wrap:wrap;
    justify-content:flex-end;max-width:420px}
  .btn{pointer-events:auto;cursor:pointer;user-select:none;
    padding:9px 15px;font-size:11px;letter-spacing:.2em;color:rgba(234,220,192,.82);
    background:linear-gradient(180deg,rgba(30,34,44,.72),rgba(14,17,24,.82));
    border:1px solid rgba(216,169,78,.26);
    border-radius:2px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:border-color .32s,color .32s,box-shadow .32s,transform .18s;
    white-space:nowrap;display:flex;align-items:center;gap:7px}
  .btn:hover{border-color:rgba(240,207,120,.68);color:#f7e9c4;
    box-shadow:0 0 22px rgba(216,169,78,.28),inset 0 0 16px rgba(216,169,78,.09)}
  .btn:active{transform:translateY(1px)}
  .btn.on{border-color:rgba(240,207,120,.8);color:#ffeec2;
    box-shadow:0 0 26px rgba(216,169,78,.4),inset 0 0 20px rgba(216,169,78,.14)}
  .btn i{font-style:normal;font-size:12.5px;opacity:.9}

  #stats{position:absolute;right:28px;top:28px;text-align:right;font-size:10px;
    letter-spacing:.18em;color:rgba(200,182,148,.4);line-height:1.95}
  #stats span{color:rgba(240,207,120,.72)}

  /* ── 加载屏 ─────────────────────────── */
  #loader{position:fixed;inset:0;z-index:100;background:
      radial-gradient(ellipse at 50% 42%,#16202e 0%,#080b12 62%,#04060a 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity 1.1s ease,visibility 1.1s}
  #loader.done{opacity:0;visibility:hidden}
  #loader .mark{width:56px;height:56px;position:relative;margin-bottom:34px;
    animation:spin 7s linear infinite}
  #loader .mark div{position:absolute;width:13px;height:13px;
    background:linear-gradient(140deg,#f6dfa6,#c9963f);box-shadow:0 0 18px rgba(216,169,78,.62)}
  #loader .mark div:nth-child(1){left:0;top:0}
  #loader .mark div:nth-child(2){right:0;top:0}
  #loader .mark div:nth-child(3){left:0;bottom:0}
  #loader .mark div:nth-child(4){right:0;bottom:0}
  #loader .lt{font-size:12px;letter-spacing:.46em;color:rgba(224,206,168,.66);margin-bottom:20px}
  #loader .bar{width:236px;height:1px;background:rgba(216,169,78,.16);position:relative;overflow:hidden}
  #loader .bar i{position:absolute;left:0;top:0;height:100%;width:0%;
    background:linear-gradient(90deg,#8a6425,#f7e3ae,#d8a94e);
    box-shadow:0 0 12px rgba(240,207,120,.8);transition:width .35s ease}
  #loader .msg{margin-top:16px;font-size:9.5px;letter-spacing:.3em;color:rgba(180,164,136,.42);
    height:14px}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  #toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:20;
    padding:9px 22px;font-size:11px;letter-spacing:.24em;color:#f5e3b6;
    background:rgba(12,15,22,.78);border:1px solid rgba(216,169,78,.3);
    border-radius:2px;opacity:0;transition:opacity .5s,transform .5s;
    backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:760px){
    .brand{left:18px;top:16px}.brand h1{font-size:16px;letter-spacing:.3em}
    .brand .cn{font-size:9px}.brand .rule{width:70px}
    .hint{display:none}
    #dock{right:12px;bottom:14px;left:12px;justify-content:center;gap:6px}
    .btn{padding:7px 10px;font-size:9.5px;letter-spacing:.1em}
    #stats{display:none}
    #toast{bottom:88px;font-size:10px}
  }
</style>

    <div class="btn" data-act="day"><i>☀</i><span>昼夜</span></div>

  </div>
</div>

<div id="vig"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CAELUM AUREUM — 体素巴洛克浮空都城
   单文件 · Three.js CDN（多源回退）· 全程序化建模，零外部素材
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var SRC = [
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js',
    'https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js',
    'https://lib.baomitu.com/three.js/r128/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
  ];
  var si = 0, started = false;

  function setMsg(t) { var e = document.getElementById('lmsg'); if (e) e.textContent = t; }
  function setBar(p) { var e = document.getElementById('lbar'); if (e) e.style.width = p + '%'; }

  function tryNext() {
    if (started) return;
    if (si >= SRC.length) {
      setMsg('CDN 全部不可达 · 请检查网络后刷新');
      return;
    }
    var url = SRC[si++];
    var s = document.createElement('script');
    s.src = url;
    s.async = false;
    var done = false;
    s.onload = function () {
      if (done) return; done = true;
      if (window.THREE) { started = true; launch(); }
      else tryNext();
    };
    s.onerror = function () { if (done) return; done = true; tryNext(); };
    document.head.appendChild(s);
    setTimeout(function () { if (!done && !window.THREE) { done = true; tryNext(); } }, 9000);
  }

  function launch() {
    setBar(12); setMsg('正在开凿基岩');
    // 让加载文字先绘一帧，再进入重计算
    requestAnimationFrame(function () {
      setTimeout(function () { try { MAIN(); } catch (e) { console.error(e); setMsg('构建失败：' + e.message); } }, 40);
    });
  }

  window.__CAE = { setMsg: setMsg, setBar: setBar };

/* ══════════════════ 0. 随机与调色板 ══════════════════ */

  var seed = 20260628;
  function rnd() {                       // mulberry32
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function rr(a, b) { return a + (b - a) * rnd(); }
  function ri(a, b) { return Math.floor(rr(a, b + 1)); }

  var P = [];
  function col(hex, kind, extra) {
    var o = { hex: hex, kind: kind || 'stone' };
    if (extra) for (var k in extra) o[k] = extra[k];
    P.push(o); return P.length - 1;
  }

  // —— 石材 / 象牙白 ——
  var IVORY   = col(0xDAC8A8);
  var IVORY2  = col(0xCCBA9B);
  var IVORY3  = col(0xBFAE90);
  var STONED  = col(0xAC9979);
  var STONES  = col(0x8C7A5C);
  var CREAM   = col(0xF0E6D3);
  var CHALK   = col(0xFFFFFF);
  // —— 金 / 铜 ——
  var GOLD    = col(0xE9A93C, 'gold');
  var GOLDL   = col(0xFFD86B, 'gold');
  var GOLDD   = col(0x8A5C12, 'gold');
  var BRONZE  = col(0x7E5E37, 'gold');
  var BRONZED = col(0x4F3A21, 'gold');
  var COPPER  = col(0x5E8C7A, 'gold');
  // —— 赭 / 陶 ——
  var OCHRE   = col(0xBA8C4F);
  var OCHRED  = col(0x8C6634);
  var TERRA   = col(0xA65A31);
  var TERRA_D = col(0x7A3E22);
  // —— 灰蓝 ——
  var SLATE   = col(0x6D8098);
  var SLATED  = col(0x4A5C72);
  var SLATEL  = col(0x96AABE);
  // —— 深红 ——
  var CRIMSON = col(0x8E2536);
  var CRIMSOND= col(0x5E1421);
  var CRIMSONL= col(0xB24B5B);
  // —— 岩 ——
  var ROCK    = col(0x5A4D3D);
  var ROCKD   = col(0x38302A);
  var ROCKL   = col(0x7A6B54);
  var ROCKMOSS= col(0x4E5739);
  // —— 植 ——
  var GRASS   = col(0x5C7A43);
  var GRASSL  = col(0x76945A);
  var HEDGE   = col(0x33562E);
  var HEDGEL  = col(0x4A7340);
  var LEAFD   = col(0x2B482B);
  var LEAF    = col(0x3E6A3A);
  // —— 水 ——
  var WATER   = col(0x7CC2D6, 'water');
  var WATERD  = col(0x4E93AC, 'water');
  var WATERL  = col(0xCBF0F8, 'water');
  // —— 云 ——
  var CLOUD   = col(0xF3F8FE, 'cloud', { flat: 1 });
  var CLOUDS  = col(0xD2E1F0, 'cloud', { flat: 1 });
  var CLOUDG  = col(0xC4D6E6, 'cloud', { flat: 1 });
  // —— 玻璃 / 发光 ——
  var GLASS   = col(0x263545, 'glass');
  var GLASSW  = col(0x3E5266, 'glass');
  var GLOW    = col(0xFFE7A4, 'glow');
  var GLOWW   = col(0xFFF6DC, 'glow');

  /* ══════════════════ 1. 体素仓库 ══════════════════ */

  var AIR = -1;
  var KMAP = new Map();   // 体素占位索引：后写覆盖先写，可挖空
  var KX = [], KY = [], KZ = [], KC = [];
  var TOT = 0;
  var CAP = null;         // 局部捕获缓冲：可动部件复用构件库
  var BOUND = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9, z0: 1e9, z1: -1e9 };

  function put(x, y, z, c) {
    x = x | 0; y = y | 0; z = z | 0;
    if (CAP !== null) { CAP.push(x, y, z, c); return; }
    var k = (x + 1024) * 4194304 + (y + 1024) * 2048 + (z + 1024);
    var i = KMAP.get(k);
    if (i === undefined) {
      KMAP.set(k, KX.length);
      KX.push(x); KY.push(y); KZ.push(z); KC.push(c);
      if (c >= 0) TOT++;
    } else {
      if (KC[i] >= 0 && c < 0) TOT--;
      else if (KC[i] < 0 && c >= 0) TOT++;
      KC[i] = c;
    }
    if (x < BOUND.x0) BOUND.x0 = x; if (x > BOUND.x1) BOUND.x1 = x;
    if (y < BOUND.y0) BOUND.y0 = y; if (y > BOUND.y1) BOUND.y1 = y;
    if (z < BOUND.z0) BOUND.z0 = z; if (z > BOUND.z1) BOUND.z1 = z;
  }

  // 实心盒 (含端点)
  function box(x0, y0, z0, x1, y1, z1, c) {
    if (x1 < x0) { var t = x0; x0 = x1; x1 = t; }
    if (y1 < y0) { var t2 = y0; y0 = y1; y1 = t2; }
    if (z1 < z0) { var t3 = z0; z0 = z1; z1 = t3; }
    for (var x = x0; x <= x1; x++)
      for (var y = y0; y <= y1; y++)
        for (var z = z0; z <= z1; z++) put(x, y, z, c);
  }
  // 只铺壳 (厚度 1)
  function shell(x0, y0, z0, x1, y1, z1, c) {
    if (x1 < x0) { var t = x0; x0 = x1; x1 = t; }
    if (y1 < y0) { var t2 = y0; y0 = y1; y1 = t2; }
    if (z1 < z0) { var t3 = z0; z0 = z1; z1 = t3; }
    for (var x = x0; x <= x1; x++)
      for (var y = y0; y <= y1; y++)
        for (var z = z0; z <= z1; z++)
          if (x === x0 || x === x1 || y === y0 || y === y1 || z === z0 || z === z1) put(x, y, z, c);
  }
  // 水平实心板
  function slab(x0, z0, x1, z1, y, c) { box(x0, y, z0, x1, y, z1, c); }
  // 空心矩形框 (半宽 w,d)
  function frame(cx, cz, y, w, d, c, th) {
    th = th || 1;
    for (var x = -w; x <= w; x++)
      for (var z = -d; z <= d; z++) {
        var ax = Math.abs(x), az = Math.abs(z);
        if (ax > w - th || az > d - th) put(cx + x, y, cz + z, c);
      }
  }
  // 水平圆盘 (填充)
  function disc(cx, cz, y, r, c) {
    var R2 = r * r + r * 0.6;
    for (var x = -r; x <= r; x++)
      for (var z = -r; z <= r; z++)
        if (x * x + z * z <= R2) put(cx + x, y, cz + z, c);
  }
  // 水平圆环
  function ring(cx, cz, y, r, th, c) {
    var R2 = r * r + r * 0.6, I2 = Math.max(0, (r - th) * (r - th) - (r - th) * 0.6);
    for (var x = -r; x <= r; x++)
      for (var z = -r; z <= r; z++) {
        var d2 = x * x + z * z;
        if (d2 <= R2 && d2 >= I2) put(cx + x, y, cz + z, c);
      }
  }
  // 圆柱 (竖直，可选空心)
  function cyl(cx, cz, y0, y1, r, c, hollow) {
    for (var y = y0; y <= y1; y++) {
      if (hollow) ring(cx, cz, y, r, hollow, c); else disc(cx, cz, y, r, c);
    }
  }
  // 竖直矩形柱体（实心/壳）
  function prism(x0, z0, x1, z1, y0, y1, c, shellOnly) {
    if (shellOnly) shell(x0, y0, z0, x1, y1, z1, c); else box(x0, y0, z0, x1, y1, z1, c);
  }

  /* ══════════════════ 2. 巴洛克构件库 ══════════════════ */

  // ── 阶梯穹顶（voxel dome）
  //  opts: {ribs, ribC, thick, bandAt[], bandC, hRatio, cap}
  function dome(cx, cy, cz, R, H, c, opts) {
    opts = opts || {};
    var ribs = opts.ribs === undefined ? 0 : opts.ribs;
    var ribC = opts.ribC === undefined ? c : opts.ribC;
    var thick = opts.thick || 2;
    var pow = opts.pow || 0.5;
    var bands = opts.bandAt || null;
    var bandC = opts.bandC === undefined ? c : opts.bandC;

    for (var y = 0; y <= H; y++) {
      var t = y / H;
      var rr = R * Math.pow(Math.max(0, 1 - t * t), pow);
      rr = Math.round(rr);
      if (rr <= 0) break;
      var outer = rr, inner = Math.max(0, rr - thick);
      var O2 = outer * outer + outer * 0.6, I2 = Math.max(0, inner * inner - inner * 0.6);
      var bandY = false;
      if (bands) for (var bi = 0; bi < bands.length; bi++) if (bands[bi] === y) bandY = true;

      for (var x = -outer; x <= outer; x++) {
        for (var z = -outer; z <= outer; z++) {
          var d2 = x * x + z * z;
          if (d2 > O2) continue;
          if (d2 < I2 && rr > thick - 1) continue;
          var cc = c;
          if (bandY) cc = bandC;
          else if (ribs > 0) {
            var ang = Math.atan2(z, x) + Math.PI;
            var seg = Math.PI * 2 / ribs;
            var rem = ang % seg; var da = Math.min(rem, seg - rem);
            if (da * rr < 1.15) cc = ribC;
          }
          put(cx + x, cy + y, cz + z, cc);
        }
      }
    }
    // 顶盖
    if (opts.cap !== false) {
      var topR = Math.max(0, Math.round(R * 0.16));
      disc(cx, cz, cy + H, topR, opts.capC === undefined ? ribC : opts.capC);
    }
  }

  // ── 鼓座（drum）：带壁柱、窗洞、檐口
  function drum(cx, cy, cz, R, H, c, cAccent, cWin) {
    for (var y = 0; y <= H; y++) {
      var seg = 20;
      for (var x = -R; x <= R; x++)
        for (var z = -R; z <= R; z++) {
          var d2 = x * x + z * z;
          if (d2 > R * R + R * 0.6 || d2 < (R - 2) * (R - 2) - R * 0.6) continue;
          var ang = Math.atan2(z, x) + Math.PI;
          var k = Math.round(ang / (Math.PI * 2 / seg));
          var isPil = (k % 2 === 0);
          var cc = c;
          // 窗洞
          var inWin = false;
          if (!isPil) {
            var mid = Math.abs(ang - (k * Math.PI * 2 / seg));
            if (y >= 2 && y <= H - 4 && mid * R < 1.5) inWin = true;
          }
          if (y === H) cc = cAccent;
          else if (y === 0 || y === 1) cc = cAccent;
          else if (inWin) cc = cWin;
          put(cx + x, cy + y, cz + z, cc);
        }
    }
  }

  // ── 采光亭（lantern）
  function lantern(cx, cy, cz, R, H, c, cGold) {
    cyl(cx, cz, cy, cy + H, R, c, 1);
    // 小拱窗
    for (var i = 0; i < 8; i++) {
      var a = i / 8 * Math.PI * 2;
      var px = Math.round(cx + Math.cos(a) * R), pz = Math.round(cz + Math.sin(a) * R);
      box(px, cy + 1, pz, px, cy + Math.max(1, H - 2), pz, GLASS);
    }
    // 檐 + 小穹顶
    ring(cx, cz, cy + H, R + 1, 1, cGold);
    disc(cx, cz, cy + H, R + 1, cGold);
    dome(cx, cy + H + 1, cz, R + 1, Math.round(R * 1.1), c, { ribs: 8, ribC: cGold, thick: 1, pow: 0.44 });
  }

  // ── 尖顶（finial / spire）—— 层层收的镀金塔尖
  function finial(cx, cy, cz, H, c, cGold) {
    var r = Math.max(2, Math.round(H * 0.16));
    for (var y = 0; y < H; y++) {
      var t = y / H;
      var rr2 = Math.max(0, Math.round(r * (1 - t * 1.05)));

    put(cx, cy + H + 1, cz, cGold);
    put(cx, cy + H + 2, cz, cGold);
    put(cx + 1, cy + H + 2, cz, cGold);
    put(cx - 1, cy + H + 2, cz, cGold);

  // ── 涡卷托架（volute）：2D 对数螺旋，垂直于平面方向挤出

  // ── 层叠檐口（三段外挑 + 齿饰）

      var half = Math.round(Math.sqrt(Math.max(0, r * r - i * i)));

  // ── 巨柱（柱础 / 柱身 / 柱头），方柱带凹槽

    box(cx - hw, y0 + 2, cz - hw, cx + hw, y0 + 2, cz + hw, cBase);

    box(cx - hw - 1, y1 - 1, cz - hw - 1, cx + hw + 1, y1 - 1, cz + hw + 1, cCap);

  // ── 栏杆（瓶柱 + 扶手）

  /* ══════════════════ 3. 细部构件 ══════════════════ */

  // ── 山花（三角楣）：可整可断，断口内卷，斜面镀金

  // ── 壁龛（凹进 + 贝壳顶 + 雕像）

  // ── 雕像（1:10 尺度的人形，巴洛克式长袍）

  // ── 飞扶壁：阶梯斜撑 + 上弦 + 墩座

    for (var i = 0; i <= n; i++) {

      var z = Math.round(z0 + (z1 - z0) * t);

  // ── 修剪树（球/锥）

  /* ══════════════════ 4. 世界构建 ══════════════════ */

  // ── 4.1 浮空岛体 ────────────────────────────────
  function buildIsland(cx, cy, cz, R, o) {

    disc(cx, cz, cy, R, rim);

    for (var i = 1; i <= depth; i++) {

  // ── 主城 InstancedMesh
  function buildMeshes() {
    var geo = new THREE.BoxGeometry(1, 1, 1);
    var buckets = new Array(P.length);
    for (var k = 0; k < KC.length; k++) {
      var c = KC[k];
      if (c < 0) continue;
      if (!buckets[c]) buckets[c] = [];
      buckets[c].push(k);
    }
    for (var ci = 0; ci < buckets.length; ci++) {
      var idx = buckets[ci];
      if (!idx || !idx.length) continue;
      var mesh = new THREE.InstancedMesh(geo, MAT[ci], idx.length);
      var arr = mesh.instanceMatrix.array, o = 0;
      for (var j = 0; j < idx.length; j++) {
        var q = idx[j];
        arr[o++] = 1; arr[o++] = 0; arr[o++] = 0; arr[o++] = 0;
        arr[o++] = 0; arr[o++] = 1; arr[o++] = 0; arr[o++] = 0;
        arr[o++] = 0; arr[o++] = 0; arr[o++] = 1; arr[o++] = 0;
        arr[o++] = KX[q]; arr[o++] = KY[q]; arr[o++] = KZ[q]; arr[o++] = 1;
      }
      mesh.instanceMatrix.needsUpdate = true;
      var kind = P[ci].kind;
      mesh.castShadow = (kind !== 'cloud');
      mesh.receiveShadow = (kind !== 'cloud' && kind !== 'glow');
      mesh.frustumCulled = false;
      scene.add(mesh);
      MESHES.push(mesh);
    }
  }

  // ── 通用：把捕获的体素列表变成一组 InstancedMesh
  function voxToMeshes(list, scale) {
    scale = scale || 1;
    var g = new THREE.Group();
    var geo = new THREE.BoxGeometry(scale, scale, scale);
    var buckets = {};
    for (var i = 0; i < list.length; i += 4) {
      var c = list[i + 3];
      if (c < 0) continue;
      if (!buckets[c]) buckets[c] = [];
      buckets[c].push(i);
    }
    for (var key in buckets) {
      var ci = +key, idx = buckets[key];
      var mesh = new THREE.InstancedMesh(geo, MAT[ci], idx.length);
      var arr = mesh.instanceMatrix.array, o = 0;
      for (var j = 0; j < idx.length; j++) {
        var q = idx[j];
        arr[o++] = 1; arr[o++] = 0; arr[o++] = 0; arr[o++] = 0;
        arr[o++] = 0; arr[o++] = 1; arr[o++] = 0; arr[o++] = 0;
        arr[o++] = 0; arr[o++] = 0; arr[o++] = 1; arr[o++] = 0;
        arr[o++] = list[q]; arr[o++] = list[q + 1]; arr[o++] = list[q + 2]; arr[o++] = 1;
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.frustumCulled = false;
      mesh.castShadow = true;
      g.add(mesh);
    }
    return g;
  }

  // ── 天空
  function makeSky() {
    var geo = new THREE.SphereGeometry(2800, 40, 22);
    skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        uTop: { value: new THREE.Color(0x2b5c96) },
        uMid: { value: new THREE.Color(0xa4c4e2) },
        uBot: { value: new THREE.Color(0xf8e3bd) },
        uSun: { value: new THREE.Vector3(0.6, 0.5, 0.4) },
        uGlow: { value: 0.85 }
      },
      vertexShader:
        'varying vec3 vP;' +
        'void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader:
        'uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBot; uniform vec3 uSun; uniform float uGlow;' +
        'varying vec3 vP;' +
        'void main(){' +
        '  vec3 n = normalize(vP);' +
        '  float h = n.y * 0.5 + 0.5;' +
        '  vec3 c = mix(uBot, uMid, smoothstep(0.0, 0.54, h));' +
        '  c = mix(c, uTop, smoothstep(0.46, 1.0, h));' +
        '  float d = max(dot(n, normalize(uSun)), 0.0);' +
        '  c += vec3(1.0,0.86,0.62) * pow(d, 28.0) * uGlow;' +
        '  c += vec3(1.0,0.9,0.72) * pow(d, 3.0) * 0.14 * uGlow;' +
        '  gl_FragColor = vec4(c, 1.0);' +
        '}'
    });
    var m = new THREE.Mesh(geo, skyMat);
    m.frustumCulled = false;
    m.renderOrder = -10;
    scene.add(m);

    // 星
    var N = 900, pos = new Float32Array(N * 3);

      pos[i * 3] = Math.sin(v) * Math.cos(u) * R;

    });
    stars = new THREE.Points(sg, sm);
    stars.frustumCulled = false;
    scene.add(stars);
  }

  function makeCloudTex(seedv, soft) {
    var S = 512;

    cv.width = cv.height = S;
    var x = cv.getContext('2d');
    x.clearRect(0, 0, S, S);
    var old = seed;

    for (var i = 0; i < 150; i++) {
      var px = rnd() * S, py = rnd() * S;

      var a = rr(0.05, 0.16);
      var g = x.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, 'rgba(255,255,255,' + a.toFixed(3) + ')');
      g.addColorStop(0.55, 'rgba(255,255,255,' + (a * 0.55).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g;
      x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.fill();
    }
    seed = old;
    var t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2.2, 2.2);
    return t;
  }

    for (var i = 0; i < specs.length; i++) {
      var s = specs[i];
      var grp = new THREE.Group();
      makeAirship(grp, 1.15);
      scene.add(grp);
      AIRS.push({
        g: grp, rad: s.rad, h: s.h, sp: s.sp, ph: s.ph,
        tour: false, tourT: 0, rad2: s.rad, h2: s.h
      });
      pick('airship', 0, 0, 0, 26);
    }
    // 热气球
    var bsp = [
      { x: -120, y: 56, z: -78, r: 26, sp: 0.32 },
      { x: 148, y: 92, z: -40, r: 34, sp: -0.24 },
      { x: -40, y: 150, z: 150, r: 22, sp: 0.18 }
    ];
    for (var j = 0; j < bsp.length; j++) {
      var b = bsp[j];
      var bg = new THREE.Group();
      bg.add(voxToMeshes(MOVERS.balloon, 1.0));
      scene.add(bg);
      BALS.push({ g: bg, x: b.x, y: b.y, z: b.z, r: b.r, sp: b.sp, ph: rnd() * 6.28 });
      pick('balloon', b.x, b.y, b.z, 24);
    }
    // 鸽群
    var dsp = [
      { cx: -44, cz: 24, cy: 86, rad: 34, n: 11, sp: 0.9, tilt: 0.05 },
      { cx: 44, cz: 24, cy: 92, rad: 28, n: 9, sp: -1.15, tilt: -0.2 },
      { cx: 0, cz: -1, cy: 104, rad: 52, n: 13, sp: 0.62, tilt: 0.1 }
    ];
    for (var d = 0; d < dsp.length; d++) {
      var ds = dsp[d];
      var meshes = voxToMeshes(MOVERS.dove, 1.5);
      var grp = new THREE.Group();
      var inst = [];
      grp.add(meshes);
      meshes.traverse(function (o) { if (o.isInstancedMesh) inst.push(o); });
      scene.add(grp);
      DOVES.push({ g: grp, cx: ds.cx, cy: ds.cy, cz: ds.cz, rad: ds.rad, n: ds.n, sp: ds.sp, inst: inst, tilt: ds.tilt });
    }
    // 旗幡
    initFlags();
  }

  function initFlags() {
    if (!FLAGS.length) return;
    var CW = 13, CH = 9;
    FLAGN = FLAGS.length;
    var total = FLAGN * CW * CH;
    var geo = new THREE.BoxGeometry(0.92, 0.92, 0.92);
    var mat = new THREE.MeshStandardMaterial({ color: 0x8e2536, metalness: 0.1, roughness: 0.62, side: THREE.DoubleSide });
    var mesh = new THREE.InstancedMesh(geo, mat, total);
    mesh.frustumCulled = false;
    mesh.castShadow = true;
    // 用 instanceColor 做双色
    var colAttr = new THREE.InstancedBufferAttribute(new Float32Array(total * 3), 3);
    var c1 = new THREE.Color(0x8e2536), c2 = new THREE.Color(0xd8a94c), c3 = new THREE.Color(0xf3e8d0);
    var p = 0;
    for (var f = 0; f < FLAGN; f++) {
      for (var i = 0; i < CW; i++) {
        for (var j = 0; j < CH; j++) {
          var c = (j === 0 || j === CH - 1 || i === 0 || i === CW - 1) ? c2 : (f % 3 === 0 ? c3 : c1);
          colAttr.setXYZ(p++, c.r, c.g, c.b);
        }
      }
    }
    mesh.geometry.setAttribute('instanceColor', colAttr);
    mat.vertexColors = false;
    mesh.material = new THREE.MeshStandardMaterial({
      color: 0xffffff, metalness: 0.15, roughness: 0.6, side: THREE.DoubleSide
    });
    scene.add(mesh);
    FLAGMESH = mesh;
    FLAGT = { cw: CW, ch: CH };
    updateFlags(0, 1);
  }

  function updateFlags(t, wind) {
    if (!FLAGMESH) return;
    var CW = 13, CH = 9;
    var arr = FLAGMESH.instanceMatrix.array;
    var o = 0;
    for (var f = 0; f < FLAGS.length; f++) {
      var F = FLAGS[f];
      var sway = wind || 1;
      for (var i = 0; i < CW; i++) {
        var ph = i * 0.62 - t * 5.4 * sway;
        var off = Math.sin(ph) * (i * 0.16 + 0.15) * sway;
        var yo = Math.cos(ph) * (i * 0.055) * sway;
        for (var j = 0; j < CH; j++) {
          var sc = 1 - i * 0.012;
          arr[o++] = sc; arr[o++] = 0; arr[o++] = 0; arr[o++] = 0;
          arr[o++] = 0; arr[o++] = sc; arr[o++] = 0; arr[o++] = 0;
          arr[o++] = 0; arr[o++] = 0; arr[o++] = sc; arr[o++] = 0;
          arr[o++] = F.x + i + 0.5;
          arr[o++] = F.y + CH - j + yo;
          arr[o++] = F.z + off;
          arr[o++] = 1;
        }
      }
    }
    FLAGMESH.instanceMatrix.needsUpdate = true;
  }

  /* ══════════════════ 10. 相机 ══════════════════ */

  function initCamera() {
    camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 1, 6000);
    applyCamera(true);
  }

  function applyCamera(force) {
    var ph = Math.max(0.22, Math.min(1.62, CAM.ph));
    var sp = Math.sin(ph), cp = Math.cos(ph);
    var x = CAM.tx + CAM.di * sp * Math.sin(CAM.th);
    var y = CAM.ty + CAM.di * cp;
    var z = CAM.tz + CAM.di * sp * Math.cos(CAM.th);
    camera.position.set(x, y, z);
    camera.lookAt(CAM.tx, CAM.ty, CAM.tz);
  }

  function initInput() {
    var el = renderer.domElement;
    var pointers = {};
    var pinchD = 0;

    function down(e) {
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (Object.keys(pointers).length === 1) {
        CAM.drag = true; CAM.lx = e.clientX; CAM.ly = e.clientY;
        CAM.vth = 0; CAM.vph = 0;
      }
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
    }
    function move(e) {
      if (!pointers[e.pointerId]) return;
      pointers[e.pointerId].x = e.clientX;
      pointers[e.pointerId].y = e.clientY;
      var ids = Object.keys(pointers);
      if (ids.length >= 2) {
        var a = pointers[ids[0]], b = pointers[ids[1]];
        var d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchD > 0) CAM.tdi = Math.max(90, Math.min(900, CAM.tdi * (pinchD / Math.max(1, d))));
        pinchD = d;
        return;
      }
      if (!CAM.drag) return;
      var dx = e.clientX - CAM.lx, dy = e.clientY - CAM.ly;
      CAM.lx = e.clientX; CAM.ly = e.clientY;
      CAM.tth -= dx * 0.0052;
      CAM.tph -= dy * 0.0042;
      CAM.tph = Math.max(0.22, Math.min(1.62, CAM.tph));
      CAM.vth = -dx * 0.0052;
      CAM.vph = -dy * 0.0042;
    }
    function up(e) {
      delete pointers[e.pointerId];
      if (!Object.keys(pointers).length) { CAM.drag = false; pinchD = 0; }
    }
    el.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    el.addEventListener('wheel', function (e) {
      e.preventDefault();
      CAM.tdi = Math.max(90, Math.min(900, CAM.tdi * (1 + Math.sign(e.deltaY) * Math.min(0.16, Math.abs(e.deltaY) * 0.0012))));
    }, { passive: false });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // 点击拾取
    el.addEventListener('click', function (e) {
      doPick(e.clientX, e.clientY);
    });
    window.__CAE.pick = doPick;
  }

  function updateCamera(dt) {
    if (!CAM.drag) {
      CAM.tth += CAM.vth;
      CAM.tph = Math.max(0.22, Math.min(1.62, CAM.tph + CAM.vph));
      CAM.vth *= 0.93; CAM.vph *= 0.93;
    }
    if (AUTOCAM) CAM.tth += dt * 0.085;
    CAM.th += (CAM.tth - CAM.th) * Math.min(1, dt * 9);
    CAM.ph += (CAM.tph - CAM.ph) * Math.min(1, dt * 9);
    CAM.di += (CAM.tdi - CAM.di) * Math.min(1, dt * 6);
    CAM.tx += (CAM.atx - CAM.tx) * Math.min(1, dt * 5);
    CAM.ty += (CAM.aty - CAM.ty) * Math.min(1, dt * 5);
    CAM.tz += (CAM.atz - CAM.tz) * Math.min(1, dt * 5);
    applyCamera();
  }

  /* ══════════════════ 11. 拾取与反馈 ══════════════════ */

  function doPick(cx, cy) {
    var ndc = new THREE.Vector2((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
    var ray = new THREE.Raycaster();
    ray.setFromCamera(ndc, camera);
    var best = null, bestD = 1e9;

    for (var i = 0; i < PICKS.length; i++) {
      var p = PICKS[i];
      var px = p.x, py = p.y, pz = p.z;
      if (p.t === 'airship') {
        var a = AIRS[0];
        px = a.g.position.x; py = a.g.position.y; pz = a.g.position.z;
      } else if (p.t === 'balloon') {
        var b = BALS[i % BALS.length];
        if (b) { px = b.g.position.x; py = b.g.position.y; pz = b.g.position.z; }
      }
      var d2 = ray.ray.distanceSqToPoint(new THREE.Vector3(px, py, pz));
      if (d2 < p.r * p.r && d2 < bestD) { bestD = d2; best = p; }
    }
    if (!best) return;
    react(best);
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('on'); }, 1900);
  }

  function react(p) {
    if (p.t === 'dome') {
      addPulse(0, 68, -1, 70, 0xffe6a0);
      addPulse(0, 88, -1, 30, 0xfff4d0);
      GOLD_FLASH = 1;
      toast('金穹回响 · 钟声震动');
    } else if (p.t === 'fountain') {
      burst(p.x, 12, p.z, 90, 0xcfeeff, 1);
      toast('喷泉苏醒');
    } else if (p.t === 'airship') {
      toggleAirship();
      toast('飞艇启航 · 开始巡游');
    } else if (p.t === 'balloon') {
      toast('热气球升空');
      for (var i = 0; i < BALS.length; i++) BALS[i].boost = 1;
    } else if (p.t === 'fall') {
      burst(p.x, -12, p.z, 120, 0xffffff, 1.4);
      toast('瀑布炸裂成雾');
    } else if (p.t === 'flag') {
      FLAGBOOST = 2.6;
      toast('旗幡猎猎');
    } else if (p.t === 'island') {
      p.up = !p.up;
      toast(p.up ? '浮岛升起' : '浮岛降下');
    }
  }

  var GOLD_FLASH = 0;
  var FLAGBOOST = 0;

  function addPulse(x, y, z, r, col) {
    var geo = new THREE.SphereGeometry(1, 20, 14);
    var mat = new THREE.MeshBasicMaterial({
      color: col, transparent: true, opacity: 0.85,
      wireframe: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.scale.setScalar(1);
    scene.add(m);
    FX.push({ kind: 'pulse', o: m, t: 0, dur: 1.5, r: r });
  }

  function burst(x, y, z, n, col, spd) {
    var pos = new Float32Array(n * 3);
    var vel = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      var a = rnd() * Math.PI * 2, e = rr(0.25, 1.1);
      var sp = rr(0.6, 1.6) * (spd || 1) * 26;
      vel[i * 3] = Math.cos(a) * Math.cos(e) * sp;
      vel[i * 3 + 1] = Math.sin(e) * sp * 1.35;
      vel[i * 3 + 2] = Math.sin(a) * Math.cos(e) * sp;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({
      color: col, size: 2.4, transparent: true, opacity: 0.95,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
    });
    var pts = new THREE.Points(g, m);
    pts.frustumCulled = false;
    scene.add(pts);
    FX.push({ kind: 'burst', o: pts, t: 0, dur: 2.2, vel: vel, g: g });
  }

  var AIRTOUR = false;
  function toggleAirship() {
    AIRTOUR = !AIRTOUR;
    for (var i = 0; i < AIRS.length; i++) AIRS[i].tour = AIRTOUR;
  }

  function updateFX(dt) {
    for (var i = FX.length - 1; i >= 0; i--) {
      var f = FX[i];
      f.t += dt;
      var k = f.t / f.dur;
      if (k >= 1) {
        scene.remove(f.o);
        if (f.o.geometry) f.o.geometry.dispose();
        if (f.o.material) f.o.material.dispose();
        FX.splice(i, 1);
        continue;
      }
      if (f.kind === 'pulse') {
        f.o.scale.setScalar(1 + k * f.r);
        f.o.material.opacity = 0.85 * (1 - k) * (1 - k);
        f.o.rotation.y += dt * 0.6;
        f.o.rotation.x += dt * 0.35;
      } else if (f.kind === 'burst') {
        var pos = f.g.attributes.position.array;
        for (var j = 0; j < pos.length; j += 3) {
          pos[j] += f.vel[j] * dt;
          pos[j + 1] += f.vel[j + 1] * dt;
          pos[j + 2] += f.vel[j + 2] * dt;
          f.vel[j] *= 0.965; f.vel[j + 1] = f.vel[j + 1] * 0.965 - 26 * dt; f.vel[j + 2] *= 0.965;
        }
        f.g.attributes.position.needsUpdate = true;
        f.o.material.opacity = 0.95 * (1 - k);
      }
    }
  }

  /* ══════════════════ 12. 更新循环 ══════════════════ */

  function updateDayNight(dt) {
    DAYT += (DAYT_T - DAYT) * Math.min(1, dt * 2.2);
    var t = DAYT;
    var d = PS.day, n = PS.night;
    SUN.color.copy(mixC(_cOut, d.sun, n.sun, t));
    SUN.intensity = lerp(d.sunI, n.sunI, t);
    SUN.position.set(lerp(d.sunP[0], n.sunP[0], t), lerp(d.sunP[1], n.sunP[1], t), lerp(d.sunP[2], n.sunP[2], t));
    AMB.color.copy(mixC(_cOut, d.amb, n.amb, t));
    AMB.intensity = lerp(d.ambI, n.ambI, t);
    HEMI.color.copy(mixC(_cOut, d.hSky, n.hSky, t));
    HEMI.groundColor.copy(mixC(_cOut, d.hGnd, n.hGnd, t));
    HEMI.intensity = lerp(d.hI, n.hI, t);
    scene.fog.color.copy(mixC(_cOut, d.fog, n.fog, t));
    scene.fog.density = lerp(d.fogD, n.fogD, t);
    skyMat.uniforms.uTop.value.copy(mixC(_cOut, d.skyTop, n.skyTop, t));
    skyMat.uniforms.uMid.value.copy(mixC(_cOut, d.skyMid, n.skyMid, t));
    skyMat.uniforms.uBot.value.copy(mixC(_cOut, d.skyBot, n.skyBot, t));
    skyMat.uniforms.uSun.value.copy(SUN.position).normalize();
    skyMat.uniforms.uGlow.value = lerp(0.95, 0.35, t);
    renderer.toneMappingExposure = lerp(d.exp, n.exp, t);
    if (stars) stars.material.opacity = Math.max(0, (t - 0.45) * 1.9);
    if (GOLD_FLASH > 0) {
      GOLD_FLASH = Math.max(0, GOLD_FLASH - dt * 1.5);
      var gm = MAT[GOLD], gl = MAT[GOLDL];
      var f = GOLD_FLASH;
      if (gm && gm.emissive) gm.emissive.setRGB(0.35 * f + 0.08, 0.26 * f + 0.05, 0.06 * f + 0.01);
      if (gl && gl.emissive) gl.emissive.setRGB(0.5 * f + 0.12, 0.4 * f + 0.08, 0.12 * f + 0.02);
    }
  }

  function updateClouds(dt) {
    for (var i = 0; i < CLOUDLAYERS.length; i++) {
      var L = CLOUDLAYERS[i];
      L.tex.offset.x += L.sp * dt;
      L.tex.offset.y += L.sp * 0.42 * dt;
      L.mesh.position.y = L.y + Math.sin(TT * 0.24 + i * 1.7) * 2.2;
      if (STORM > 0) L.mesh.position.y += Math.sin(TT * 1.3 + i) * 6 * STORM;
    }
  }
  var STORM = 0;

  function updateAirship(dt) {
    for (var i = 0; i < AIRS.length; i++) {
      var a = AIRS[i];
      a.ph += dt * a.sp;
      var rad = a.rad, h = a.h;
      if (a.tour) {
        a.tourT += dt * 0.25;
        rad = a.rad + Math.sin(a.tourT) * 62;
        h = a.h + Math.sin(a.tourT * 1.7) * 34;
      }
      var x = Math.cos(a.ph) * rad;
      var z = Math.sin(a.ph) * rad * 0.82;
      var y = h + Math.sin(a.ph * 2.3 + i) * 12;
      a.g.position.set(x, y, z);
      var nx = Math.cos(a.ph + 0.02 * Math.sign(a.sp)) * rad;
      var nz = Math.sin(a.ph + 0.02 * Math.sign(a.sp)) * rad * 0.82;
      a.g.rotation.y = Math.atan2(nx - x, nz - z);
      a.g.rotation.z = Math.sin(a.ph * 1.3) * 0.05;
    }
  }

  function updateBalloons(dt) {
    for (var i = 0; i < BALS.length; i++) {
      var b = BALS[i];
      if (b.boost > 0) b.boost = Math.max(0, b.boost - dt * 0.4);
      var bo = (b.boost || 0) * 34;
      var a = TT * b.sp + b.ph;
      b.g.position.set(
        b.x + Math.cos(a) * b.r,
        b.y + bo + Math.sin(a * 1.6) * 7,
        b.z + Math.sin(a) * b.r * 0.8
      );
      b.g.rotation.y = a;
      b.g.rotation.z = Math.sin(a * 1.1) * 0.06;
    }
  }

  function updateDoves(dt) {
    for (var i = 0; i < DOVES.length; i++) {
      var d = DOVES[i];
      var a = TT * d.sp;
      d.g.position.set(
        d.cx + Math.cos(a) * d.rad,
        d.cy + Math.sin(a * 2.3) * 7,
        d.cz + Math.sin(a) * d.rad
      );
      d.g.rotation.y = -a + Math.PI / 2;
      d.g.rotation.z = d.tilt;
      // 翅膀拍打
      for (var k = 0; k < d.inst.length; k++) {
        var im = d.inst[k];
        im.rotation.z = Math.sin(TT * 7 + i) * 0.06;
      }
    }
  }

  function updateFalls(dt) {
    for (var i = 0; i < FALLS.length; i++) {
      var f = FALLS[i];
      f.tex.offset.y += dt * 0.9;      // offset.y 递增 = 纹理向下滚 = 水往下落
      f.ptex.offset.x += dt * 0.012;
      f.mist.material.opacity = 0.42 + Math.sin(TT * 0.9 + i) * 0.08;
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(0.05, clock.getDelta());
    TT += dt;
    if (FLAGBOOST > 0) FLAGBOOST = Math.max(0, FLAGBOOST - dt * 0.5);
    if (STORM > 0) STORM = Math.max(0, STORM - dt * 0.28);
    updateCamera(dt);
    updateDayNight(dt);
    updateClouds(dt);
    updateAirship(dt);
    updateBalloons(dt);
    updateDoves(dt);
    updateFalls(dt);
    updateFX(dt);
    updateFlags(TT, 1 + FLAGBOOST);
    renderer.render(scene, camera);
  }

  /* ══════════════════ 13. 启动 ══════════════════ */

  var FPS_T = 0, FPS_N = 0, FPS_V = 0;

  function initUI() {
    var btns = document.querySelectorAll('#dock .btn');
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        b.addEventListener('click', function () {
          var act = b.getAttribute('data-act');
          if (act === 'day') {
            DAYT_T = DAYT_T > 0.5 ? 0 : 1;
            b.classList.toggle('on', DAYT_T > 0.5);
            toast(DAYT_T > 0.5 ? '夜幕降临 · 灯火初上' : '晨光复苏');
          } else if (act === 'orbit') {
            AUTOCAM = !AUTOCAM;
            b.classList.toggle('on', AUTOCAM);
          } else if (act === 'storm') {
            STORM = 1;
            toast('云海翻涌');
          } else if (act === 'reset') {
            CAM.tth = 0.62; CAM.tph = 1.14; CAM.tdi = 348;
            CAM.atx = 0; CAM.aty = 34; CAM.atz = -4;
            AUTOCAM = false;
            var ob = document.querySelector('[data-act="orbit"]');
            if (ob) ob.classList.remove('on');
          }
        });
      })(btns[i]);
    }
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space') {
        e.preventDefault();
        var b = document.querySelector('[data-act="day"]');
        if (b) b.click();
      } else if (e.key === 'r' || e.key === 'R') {
        var r = document.querySelector('[data-act="reset"]');
        if (r) r.click();
      }
    });
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  function MAIN() {
    var bar = window.__CAE.setBar, msg = window.__CAE.setMsg;

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xc3d8ea, 0.00082);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.60;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();
    _cA = new THREE.Color(); _cB = new THREE.Color(); _cOut = new THREE.Color();
    makeMaterials();
    buildAll();
    bar(90); msg('组装体素');
    buildMeshes();
    makeSky();
    makeEnv();
    tuneMaterials();
    makeCloudSea();
    makeFalls();
    makeLights();
    initMovers();
    initCamera();
    initInput();
    initUI();
    bar(100); msg('初见');

    var sv = document.getElementById('sv'), sd = document.getElementById('sd'), sf = document.getElementById('sf');
    if (sv) sv.textContent = TOT.toLocaleString('en-US');
    if (sd) sd.textContent = MESHES.length;

    setTimeout(function () {
      var l = document.getElementById('loader');
      if (l) l.classList.add('done');
    }, 260);

    animate();

    // FPS
    var last = performance.now(), frames = 0;
    setInterval(function () {
      var now = performance.now();
      frames++;
      var el = now - last;
      if (el > 900) {
        FPS_V = Math.round(frames * 1000 / el);
        if (sf) sf.textContent = FPS_V;
        frames = 0; last = now;
      }
    }, 250);
  }

  window.__CAE = window.__CAE || {};
  window.__CAE.MAIN = MAIN;

  tryNext();
})();
</script>
</body>
</html>
